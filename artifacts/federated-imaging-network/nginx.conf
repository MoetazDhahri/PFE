# Only sets "Connection: upgrade" for actual WebSocket handshake requests
# (where the client sent an Upgrade header) — every other /api/ request
# keeps a normal keep-alive connection to the upstream.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxies to the coordinator API container/service. Without this, the
  # frontend and backend are never actually connected in production — the
  # SPA's /api/* fetches would just 404 against nginx's static file root.
  # API_BACKEND_HOST is substituted at container startup (see Dockerfile);
  # defaults to the sibling Docker Compose/Container Apps service name.
  location /api/ {
    proxy_pass http://${API_BACKEND_HOST}:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Required for /api/ws (real-time push) — without the Upgrade/Connection
    # headers, nginx proxies it as a normal HTTP request and the WebSocket
    # handshake fails.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # Single-page app: unmatched paths fall back to index.html so client-side
  # routing (wouter) handles them instead of returning a 404 from nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
