server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unmatched paths fall back to index.html so client-side
  # routing (wouter) handles them instead of returning a 404 from nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
