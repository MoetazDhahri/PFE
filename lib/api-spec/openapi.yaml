openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: federation
    description: Federated imaging network operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /network/overview:
    get:
      operationId: getNetworkOverview
      tags: [federation]
      summary: Get the current network overview
      parameters:
        - name: track
          in: query
          required: false
          schema:
            type: string
            default: chest-xray
      responses:
        "200":
          description: Current federation overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkOverview"
  /network/nodes:
    get:
      operationId: getNetworkNodes
      tags: [federation]
      summary: List participating client nodes
      parameters:
        - name: track
          in: query
          required: false
          schema:
            type: string
            default: chest-xray
      responses:
        "200":
          description: Ten participating client nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientNode"
  /network/events:
    get:
      operationId: getNetworkEvents
      tags: [federation]
      summary: List recent network activity events
      parameters:
        - name: track
          in: query
          required: false
          schema:
            type: string
            default: chest-xray
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Recent activity events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /network/training-rounds:
    get:
      operationId: getTrainingRounds
      tags: [federation]
      summary: List per-round global evaluation metrics for a completed real training run
      parameters:
        - name: track
          in: query
          required: false
          schema:
            type: string
            default: chest-xray
      responses:
        "200":
          description: Round-by-round global metrics, ordered by round ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingRound"
  /network/agent/assessment:
    get:
      operationId: getAgentAssessment
      tags: [federation]
      summary: Get the latest AI federation assessment
      parameters:
        - name: track
          in: query
          required: false
          schema:
            type: string
            default: chest-xray
      responses:
        "200":
          description: Current agent assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAssessment"
  /network/agent/assessments:
    post:
      operationId: generateAgentAssessment
      tags: [federation]
      summary: Ask the Federation Agent to analyze current track telemetry and produce a new assessment
      description: >-
        Runs a real model call with tool use over the track's current
        network overview, client nodes, and recent events, then records the
        result as a new pending Action Value Card. If a pending assessment
        already exists for the track, that one is returned unchanged instead
        of generating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateAgentAssessmentInput"
      responses:
        "200":
          description: The current assessment for the track (freshly generated, or an already-pending one)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAssessment"
  /network/agent/history:
    get:
      operationId: getAgentActionHistory
      tags: [federation]
      summary: List past resolved AI federation actions
      parameters:
        - name: track
          in: query
          required: false
          schema:
            type: string
            default: chest-xray
      responses:
        "200":
          description: Past resolved agent actions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentAssessment"
  /network/events/{eventId}/ask:
    post:
      operationId: askAboutEvent
      tags: [federation]
      summary: Ask the Federation Agent a question about a specific logged event
      description: >-
        Runs a real model call, grounded in the event's own record plus
        optional lookups (network overview, client nodes, recent events),
        to answer a free-form question about why something happened. Not
        persisted — this is a read-only Q&A, not an audited action.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskAboutEventInput"
      responses:
        "200":
          description: The agent's grounded answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskAboutEventResult"
  /network/inference:
    post:
      operationId: classifyChestXray
      tags: [federation]
      summary: Classify an uploaded chest X-ray image with the real trained chest-xray model
      description: >-
        Runs a real forward pass through the ONNX-exported model produced by
        a completed ml/federation-engine training run (see
        docs/production-readiness.md). Not an LLM call and not a diagnostic
        device — a real but small research model trained on PneumoniaMNIST.
        Returns 503 if no trained model has been imported yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyChestXrayInput"
      responses:
        "200":
          description: Real model prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyChestXrayResult"
        "403":
          description: nodeId was set but nodeApiKey was missing or did not match that node's real credential
  /network/tracks:
    get:
      operationId: getLearningTracks
      tags: [federation]
      summary: List supported medical-imaging learning tracks
      responses:
        "200":
          description: Supported learning tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningTrack"
  /network/actions/{actionId}/resolve:
    post:
      operationId: resolveAgentAction
      tags: [federation]
      summary: Approve or dismiss an agent recommendation
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionResolutionInput"
      responses:
        "200":
          description: Resolved agent action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResolution"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NetworkOverview:
      type: object
      required:
        - networkName
        - round
        - roundStatus
        - connectedSites
        - totalSites
        - globalAuc
        - globalAccuracy
        - privacyBudget
        - privacyStatus
        - modelVersion
        - lastUpdated
        - trackId
      properties:
        networkName:
          type: string
        round:
          type: integer
        roundStatus:
          type: string
        connectedSites:
          type: integer
        totalSites:
          type: integer
        globalAuc:
          type: number
        globalAccuracy:
          type: number
        privacyBudget:
          type: number
        privacyStatus:
          type: string
        modelVersion:
          type: string
        lastUpdated:
          type: string
        trackId:
          type: string
    ClientNode:
      type: object
      required:
        - id
        - name
        - shortName
        - region
        - modality
        - status
        - dataVolume
        - localAuc
        - privacyStatus
        - lastSeen
        - x
        - y
        - trackId
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: string
        region:
          type: string
        modality:
          type: string
        status:
          type: string
        dataVolume:
          type: integer
        localAuc:
          type: number
        privacyStatus:
          type: string
        lastSeen:
          type: string
        x:
          type: number
        y:
          type: number
        trackId:
          type: string
    ActivityEvent:
      type: object
      required:
        - id
        - timestamp
        - actor
        - type
        - title
        - detail
        - severity
        - round
        - trackId
      properties:
        id:
          type: string
        timestamp:
          type: string
        actor:
          type: string
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        severity:
          type: string
        round:
          type: integer
        nodeId:
          type: ["string", "null"]
        trackId:
          type: string
    TrainingRound:
      type: object
      required:
        - id
        - trackId
        - round
        - globalLoss
        - globalAccuracy
        - globalSensitivity
        - globalSpecificity
        - recordedAt
      properties:
        id:
          type: string
        trackId:
          type: string
        round:
          type: integer
        globalLoss:
          type: number
        globalAccuracy:
          type: number
        globalSensitivity:
          type: number
        globalSpecificity:
          type: number
        privacyEpsilon:
          type: ["number", "null"]
          description: >-
            Real (epsilon, delta)-DP guarantee at this round from DP-SGD
            (Opacus RDP accountant) — the weakest per-client epsilon so
            far. Null for rounds imported before DP-SGD existed.
        recordedAt:
          type: string
    AgentAssessment:
      type: object
      required:
        - id
        - headline
        - summary
        - purpose
        - recommendation
        - expectedValue
        - observedValue
        - confidence
        - impact
        - risk
        - evidence
        - status
        - outcome
        - createdAt
        - resolvedAt
        - trackId
      properties:
        id:
          type: string
        headline:
          type: string
        summary:
          type: string
        purpose:
          type: string
        recommendation:
          type: string
        expectedValue:
          type: string
        observedValue:
          type: ["string", "null"]
        confidence:
          type: number
        impact:
          type: string
        risk:
          type: string
        evidence:
          type: array
          items:
            type: string
        status:
          type: string
        outcome:
          type: ["string", "null"]
        createdAt:
          type: string
        resolvedAt:
          type: ["string", "null"]
        trackId:
          type: string
    LearningTrack:
      type: object
      required:
        - id
        - name
        - modality
        - task
        - model
        - primaryMetric
        - secondaryMetrics
        - description
      properties:
        id:
          type: string
        name:
          type: string
        modality:
          type: string
        task:
          type: string
        model:
          type: string
        primaryMetric:
          type: string
        secondaryMetrics:
          type: array
          items:
            type: string
        description:
          type: string
    ClassifyChestXrayInput:
      type: object
      required:
        - imageBase64
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data (PNG/JPEG), no data URL prefix.
        nodeId:
          type: ["string", "null"]
          description: >-
            Optional. If set, assigns this image to that hospital node —
            increments its real dataVolume by one and logs a real activity
            event. The raw image itself is never persisted, only the
            classification result and the fact that one more sample now
            exists at that site (consistent with this platform's "raw
            imaging never leaves the site" design). Requires nodeApiKey to
            match that node's real credential — without it, or with a wrong
            key, the request is rejected with 403 rather than silently
            attributing the upload to a hospital that never authenticated
            as itself.
        nodeApiKey:
          type: ["string", "null"]
          description: >-
            Required when nodeId is set. The hospital's real per-node API
            key (issued once by seed.ts / issue-node-keys.ts, verified by
            hash — see docs/production-readiness.md).
    ClassifyChestXrayResult:
      type: object
      required:
        - prediction
        - confidence
        - normalProbability
        - pneumoniaProbability
        - modelVersion
        - assignedNodeId
        - assignedNodeName
      properties:
        prediction:
          type: string
          enum: [normal, pneumonia]
        confidence:
          type: number
        normalProbability:
          type: number
        pneumoniaProbability:
          type: number
        modelVersion:
          type: string
        assignedNodeId:
          type: ["string", "null"]
        assignedNodeName:
          type: ["string", "null"]
    AskAboutEventInput:
      type: object
      required:
        - question
      properties:
        question:
          type: string
    AskAboutEventResult:
      type: object
      required:
        - eventId
        - question
        - answer
        - answeredAt
      properties:
        eventId:
          type: string
        question:
          type: string
        answer:
          type: string
        answeredAt:
          type: string
    GenerateAgentAssessmentInput:
      type: object
      required:
        - track
      properties:
        track:
          type: string
    ActionResolutionInput:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum: [approved, dismissed]
    ActionResolution:
      type: object
      required:
        - actionId
        - decision
        - resolvedAt
        - message
        - observedValue
        - outcome
      properties:
        actionId:
          type: string
        decision:
          type: string
        resolvedAt:
          type: string
        message:
          type: string
        observedValue:
          type: string
        outcome:
          type: string

